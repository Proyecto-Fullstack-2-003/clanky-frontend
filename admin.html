<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Clanky Disquería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Header -->
    <header>
        <nav class="navbar navbar-expand-lg nav-clanky">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <img src="https://i.pinimg.com/736x/67/62/03/676203cc2d70b1ea218810abf0da6600.jpg" alt="Clanky Logo"
                        width="40" height="40" class="d-inline-block align-text-top me-2">
                    <span class="brand-text">Clanky</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Activar navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="catalogo.html">Catalogo</a></li>
                    </ul>
                    <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0 icon-links">
                        <span class="btn btn-warning btn-sm fw-bold text-dark">
                            <i class="bi bi-gear-fill"></i> Administración
                        </span>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main -->
    <main class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h1 class="fw-bold h3 mb-0">Panel de Administración</h1>
                <p class="text-muted mb-0">Gestión de productos de Clanky — <span id="admin-nombre"></span></p>
            </div>
            <button id="btn-cerrar-sesion-admin" class="btn btn-outline-danger btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
            </button>
        </div>

        <!-- Resumen -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h6 class="text-muted">Productos</h6>
                        <h2 id="totalProductos">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h6 class="text-muted">Unidades en stock</h6>
                        <h2 id="totalStock">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h6 class="text-muted">Formatos</h6>
                        <h2 id="totalCategorias">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Gestión de productos -->
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h2 class="h5 mb-0">Productos</h2>
                <button class="btn btn-success btn-sm" id="btnNuevoProducto">+ Nuevo producto</button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Producto</th>
                                <th>Formato</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProductos"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Formulario -->
        <div id="formularioProducto" class="card shadow-sm border-0 mt-4 d-none">
            <div class="card-header bg-clanky-red text-white">
                <h2 class="h5 mb-0">Agregar producto</h2>
            </div>
            <div class="card-body">
                <form id="formProducto">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nombreProducto" class="form-label">Nombre</label>
                            <input type="text" id="nombreProducto" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="formatoProducto" class="form-label">Formato</label>
                            <select id="formatoProducto" class="form-select" required>
                                <option value="Vinilo">Vinilo</option>
                                <option value="CD">CD</option>
                                <option value="Merch">Merch</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="precioProducto" class="form-label">Precio</label>
                            <input type="number" id="precioProducto" class="form-control" min="0" required>
                        </div>
                        <div class="col-md-6">
                            <label for="stockProducto" class="form-label">Stock</label>
                            <input type="number" id="stockProducto" class="form-control" min="0" required>
                        </div>
                        <div class="col-12">
                            <label for="imagenProducto" class="form-label">URL de imagen</label>
                            <input type="url" id="imagenProducto" class="form-control" placeholder="https://..." required>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-success">Guardar producto</button>
                            <button type="button" id="btnCancelar" class="btn btn-secondary">Cancelar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="footer-clanky text-center p-3 mt-5">
        <p class="mb-0">&copy; 2026 Disquería Clanky. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
