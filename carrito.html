<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito - Clanky Disquería</title>
    <!-- Bootstrap CSS e Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Encabezado -->
    <header>
        <div id="navbar"></div>
    </header>

    <!-- Vista de Carrito -->
    <main class="container my-5 flex-grow-1">
        <h2 class="text-center text-white fw-bold"
            style="text-shadow: 2px 2px 4px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;">
            Mi Carrito de Compras
        </h2>

        <div class="row g-4">
            <!-- Tabla de productos -->
            <div class="col-lg-8">
                <div class="table-responsive bg-white rounded shadow-sm p-3">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th class="text-center">Cantidad</th>
                                <th>Subtotal</th>
                                <th class="text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="items-carrito">
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Resumen de Compra -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm p-3">
                    <div class="card-body">
                        <h4 class="card-title fw-bold mb-4">Resumen de Compra</h4>
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <span class="fs-5 fw-bold">TOTAL:</span>
                            <span id="total-carrito" class="fs-4 fw-bold text-danger">$0</span>
                        </div>

                        <div id="mensaje-carrito" class="mb-3"></div>

                        <div class="mb-3">
                            <label for="cupon" class="form-label small text-muted">¿Tienes un cupón?</label>
                            <div class="input-group">
                                <input type="text" id="cupon" class="form-control" placeholder="Código de descuento">
                                <button id="btn-cupon" class="btn btn-outline-secondary" type="button">Aplicar</button>
                            </div>
                        </div>

                        <button id="btn-pagar" class="btn btn-success w-100 py-2 fw-bold mb-2">
                            <i class="bi bi-credit-card me-1"></i> PAGAR
                        </button>

                        <button class="btn btn-outline-danger w-100 py-2" onclick="vaciarCarrito()">
                            <i class="bi bi-trash me-1"></i> Vaciar Carrito
                        </button>
                    </div>
                </div>
            </div>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/componentes.js"></script>
</body>

</html>
