<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Clanky Disquería</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Encabezado y Navegación -->
    <header>
        <div id="navbar"></div>
    </header>

    <!-- Contenido Principal -->
    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">

                <div class="card border-0 shadow-lg login-card">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <i class="bi bi-person-circle fs-1 login-icon"></i>
                            <h2 class="fw-bold mt-2 mb-0">Bienvenido a Clanky</h2>
                            <p class="text-muted mb-0">Ingresa a tu cuenta</p>
                        </div>

                        <!-- Pestañas: Cliente / Admin -->
                        <ul class="nav nav-pills nav-fill mb-4 login-tabs" id="loginTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="tab-cliente-btn" data-bs-toggle="tab"
                                    data-bs-target="#tab-cliente" type="button" role="tab"
                                    aria-controls="tab-cliente" aria-selected="true">
                                    <i class="bi bi-person-fill me-1"></i> Cliente
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="tab-admin-btn" data-bs-toggle="tab"
                                    data-bs-target="#tab-admin" type="button" role="tab" aria-controls="tab-admin"
                                    aria-selected="false">
                                    <i class="bi bi-shield-lock-fill me-1"></i> Administrador
                                </button>
                            </li>
                        </ul>

                        <div class="tab-content" id="loginTabContent">

                            <!-- ===================== LOGIN CLIENTE ===================== -->
                            <div class="tab-pane fade show active" id="tab-cliente" role="tabpanel"
                                aria-labelledby="tab-cliente-btn">

                                <form id="form-login-cliente" novalidate>
                                    <input type="hidden" name="tipoLogin" value="cliente">

                                    <div class="mb-3">
                                        <label for="cliente-email" class="form-label fw-semibold">Correo
                                            electrónico</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                                            <input type="email" class="form-control" id="cliente-email"
                                                name="email" placeholder="tucorreo@ejemplo.com" required autocomplete="username">
                                        </div>
                                        <div class="invalid-feedback-custom" id="cliente-email-feedback"></div>
                                    </div>

                                    <div class="mb-2">
                                        <label for="cliente-password" class="form-label fw-semibold">Contraseña</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                                            <input type="password" class="form-control" id="cliente-password"
                                                name="password" placeholder="Ingresa tu contraseña" required
                                                autocomplete="current-password">
                                            <button class="btn btn-outline-secondary toggle-password" type="button"
                                                data-target="cliente-password" tabindex="-1">
                                                <i class="bi bi-eye"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Validaciones en vivo de la contraseña -->
                                    <ul class="password-checklist list-unstyled small mb-3" id="cliente-password-checklist">
                                        <li data-rule="length"><i class="bi bi-circle"></i> Mínimo 8 caracteres</li>
                                        <li data-rule="mayuscula"><i class="bi bi-circle"></i> Al menos una mayúscula
                                        </li>
                                        <li data-rule="minuscula"><i class="bi bi-circle"></i> Al menos una minúscula
                                        </li>
                                        <li data-rule="numero"><i class="bi bi-circle"></i> Al menos un número</li>
                                        <li data-rule="especial"><i class="bi bi-circle"></i> Al menos un carácter
                                            especial (!@#$%...)</li>
                                    </ul>

                                    <div class="form-check mb-3">
                                        <input class="form-check-input" type="checkbox" id="cliente-recordar">
                                        <label class="form-check-label small" for="cliente-recordar">Recordarme</label>
                                    </div>

                                    <div id="cliente-login-error" class="alert alert-danger py-2 small d-none"></div>

                                    <button type="submit" class="btn btn-clanky-login w-100 fw-bold py-2">
                                        Iniciar sesión
                                    </button>
                                </form>
                            </div>

                            <!-- ===================== LOGIN ADMIN ===================== -->
                            <div class="tab-pane fade" id="tab-admin" role="tabpanel" aria-labelledby="tab-admin-btn">

                                <div class="alert alert-warning small d-flex align-items-center gap-2 mb-3">
                                    <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                                    <span>Acceso restringido solo para personal autorizado de Clanky.</span>
                                </div>

                                <form id="formLoginAdmin" novalidate>

                                    <div class="mb-3">
                                        <label for="admin-usuario" class="form-label fw-semibold">Usuario</label>
                                        <input type="text" id="admin-usuario" class="form-control" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="admin-password" class="form-label fw-semibold">Contraseña</label>
                                        <input type="password" id="admin-password" class="form-control" required>
                                    </div>

                                    <div id="mensajeLoginAdmin" class="mb-3"></div>

                                    <button type="submit" class="btn btn-dark-login w-100 fw-bold py-2">
                                        <i class="bi bi-shield-lock-fill me-1"></i> Iniciar sesión como Admin
                                    </button>
                                </form>
                                <hr class="my-4">
                                <div class="alert alert-info py-2 px-3 mb-0 small">
                                    <strong>Usuario:</strong> <code>admin</code><br>
                                    <strong>Contraseña:</strong> <code>1234</code>
                                </div>                                
                            </div>

                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/componentes.js"></script>
</body>

</html>
