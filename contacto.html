<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Clanky Disquería</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- CSS del proyecto -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Encabezado -->
    <div id="navbar"></div>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card border-0 rounded-0" style="border: 3px solid #111 !important; box-shadow: 8px 8px 0px #111;">
                    <div class="card-body p-4 p-md-5 bg-white text-dark">
                        
                        <h1 class="h2 text-center mb-2 fw-bold" style="color: #d12020;">Contáctanos</h1>
                        <p class="text-center text-muted mb-4 fw-bold">Escríbenos por dudas sobre tus discos o envíos.</p>
                        
                        <div id="mensajeContacto"></div>
                        
                        <form id="formContacto" novalidate>
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">Correo electrónico</label>
                                <input type="email" class="form-control form-control-lg rounded-0" id="email" placeholder="nombre@ejemplo.com" style="border: 2px solid #111;">
                                <div id="errorEmail" class="text-danger mt-1 small fw-bold"></div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="asunto" class="form-label fw-bold">Asunto</label>
                                <input type="text" class="form-control form-control-lg rounded-0" id="asunto" placeholder="¿En qué podemos ayudarte?" style="border: 2px solid #111;">
                                <div id="errorAsunto" class="text-danger mt-1 small fw-bold"></div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="mensaje" class="form-label fw-bold">Mensaje</label>
                                <textarea class="form-control rounded-0" id="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." style="border: 2px solid #111;"></textarea>
                                <div id="errorMensaje" class="text-danger mt-1 small fw-bold"></div>
                            </div>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn fw-bold px-5 py-2 fs-5 text-uppercase mt-2" style="background-color: #d12020; color: #ffdd00; border: 2px solid #111; box-shadow: 4px 4px 0px #111; transition: 0.2s;">
                                    Enviar mensaje
                                </button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/componentes.js"></script>
</body>
</html>
