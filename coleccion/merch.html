<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERCH - Clanky Disquería</title>
    <!-- Bootstrap CSS e Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- CSS -->
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <!-- Encabezado -->
    <header>
        <div id="navbar"></div>
    </header>

<!-- Catálogo de Productos -->
    <main class="container my-5">
        <h2 class="text-center text-white fw-bold"
            style="text-shadow: 2px 2px 4px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;">
            MERCH
        </h2>
        
        <!-- Controles de Filtro y Orden -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3 mb-4">
            <!-- Buscador -->
            <div class="w-100 flex-grow-1">
                <input type="search" id="input-busqueda" class="form-control form-control-lg border-dark border-2"
                    placeholder="Buscar artista, disco o formato...">
            </div>

            <!-- Selector de orden -->
            <div class="w-100" style="max-width: 250px;">
                <select id="orden-productos" class="form-select form-select-lg border-dark border-2">
                    <option value="todos">Ordenar por...</option>
                    <option value="az">Nombre (A - Z)</option>
                    <option value="za">Nombre (Z - A)</option>
                    <option value="menor">Menor precio</option>
                    <option value="mayor">Mayor precio</option>
                </select>
            </div>
        </div>

        <div id="contenedor-productos" class="row" data-categoria="merch"></div>

    </main>

    <!-- FOOTER -->
    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/catalogo.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/componentes.js"></script>
</body>
</body>

</html>
